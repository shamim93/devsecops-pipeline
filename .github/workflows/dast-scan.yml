name: DAST - Dynamic Security Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start Application with SQLite
      env:
        USE_SQLITE: 'True'
        DJANGO_SUPERUSER_USERNAME: shamim93
        DJANGO_SUPERUSER_EMAIL: shamim41.cse@gmail.com
        DJANGO_SUPERUSER_PASSWORD: sha9893mim
      run: |
        echo "Running migrations..."
        python manage.py migrate
        
        echo "Creating superuser..."
        python manage.py createsuperuser --noinput || true
        
        echo "Starting Django development server..."
        nohup python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
        
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8000 > /dev/null; then
            echo " Server is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
    
    - name: Verify Application is Running
      run: |
        curl -f http://localhost:8000 || (cat server.log && exit 1)
        echo " Application is responding"
        echo "Testing endpoints..."
        curl -s http://localhost:8000/api/tasks/ || echo "API endpoint check (expected to fail without auth)"
    
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.13.0
      with:
        target: 'http://localhost:8000'
        allow_issue_writing: false
        fail_action: false
      continue-on-error: true
    
    - name: Run OWASP ZAP Full Scan
      run: |
        echo "Running ZAP Full Scan..."
        docker run --network="host" \
          -v $(pwd):/zap/wrk/:rw \
          -t ghcr.io/zaproxy/zaproxy:stable \
          zap-full-scan.py \
          -t http://localhost:8000 \
          -r zap-full-report.html \
          -J zap-full-report.json \
          -w zap-full-report.md \
          -I || true
      continue-on-error: true
    
    - name: Display ZAP Summary
      if: always()
      run: |
        echo "=========================================="
        echo "DAST Scan Complete"
        echo "=========================================="
        if [ -f zap-full-report.md ]; then
          echo "Scan results summary:"
          head -50 zap-full-report.md || true
        else
          echo "Report generation in progress..."
        fi
    
    - name: Upload ZAP Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-reports
        path: |
          zap-full-report.html
          zap-full-report.json
          zap-full-report.md
          server.log
    
    - name: Upload Server Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: server.log