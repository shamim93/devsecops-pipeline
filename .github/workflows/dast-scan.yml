name: DAST - Dynamic Security Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and Start Application
      run: |
        echo "Building and starting application..."
        docker compose up -d
        
        echo "Waiting for application to be ready..."
        sleep 30
        
        echo "Creating superuser..."
        docker compose exec -T web python manage.py createsuperuser --noinput --username admin --email admin@test.com || true
        
        echo "Application is running at http://localhost:8000"
    
    - name: Verify Application is Running
      run: |
        curl -f http://localhost:8000 || (echo "Application failed to start" && exit 1)
        echo " Application is responding"
    
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.13.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        fail_action: false  # Don't fail for demo
    
    - name: Run OWASP ZAP Full Scan
      run: |
        docker run --network="host" -v $(pwd):/zap/wrk/:rw \
          -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
          -t http://localhost:8000 \
          -r zap-full-report.html \
          -J zap-full-report.json \
          -w zap-full-report.md || true
      continue-on-error: true
    
    - name: Upload ZAP Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-reports
        path: |
          zap-full-report.html
          zap-full-report.json
          zap-full-report.md
    
    - name: Stop Application
      if: always()
      run: |
        docker compose down