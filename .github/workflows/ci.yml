name: CI/CD Pipeline with Security Scanning and Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BANDIT_SEVERITY_THRESHOLD: MEDIUM
  SAFETY_SEVERITY_THRESHOLD: MEDIUM
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django Tests
      env:
        USE_SQLITE: 'True'
      run: |
        python manage.py migrate
        python manage.py test

    - name: Check Django deployment readiness
      env:
        USE_SQLITE: 'True'
      run: |
        python manage.py check --deploy || true

  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Security Scan
      id: bandit_scan
      run: |
        bandit -r tasks/ securetask/ -f json -o bandit-report.json -ll || true
        bandit -r tasks/ securetask/ -ll
      continue-on-error: false

    - name: Upload Bandit Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies and Safety
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety

    - name: Run Safety Check
      id: safety_scan
      run: |
        echo "Running Safety dependency scan"
        echo "Safety version: $(safety --version)"

        # Try new scan command
        safety scan --output json > safety-report.json 2>&1 || true

        # Validate JSON
        if python3 -c "import json; json.load(open('safety-report.json'))" 2>/dev/null; then
          echo "Valid JSON from scan command"
        else
          echo "Trying check command..."
          safety check --json > safety-report.json 2>&1 || true

          # Validate again
          if python3 -c "import json; json.load(open('safety-report.json'))" 2>/dev/null; then
            echo "Valid JSON from check command"
          else
            echo "Creating structured JSON from text output"
            safety scan > safety-output.txt 2>&1 || true

            python3 << 'PYTHON_EOF'
import json
try:
    with open('safety-output.txt', 'r') as f:
        content = f.read()
    report = {
        "tool": "Safety",
        "raw_output": content,
        "vulnerabilities": []
    }
    with open('safety-report.json', 'w') as f:
        json.dump(report, f, indent=2)
    print("Created JSON from text output")
except Exception as e:
    print(f"Error: {e}")
    with open('safety-report.json', 'w') as f:
        json.dump({"tool": "Safety", "vulnerabilities": []}, f)
PYTHON_EOF
          fi
        fi

        echo "=== Safety Report ==="
        cat safety-report.json

        echo "=== Safety Text Output ==="
        safety scan || true
      continue-on-error: true

    - name: Upload Safety Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safety-dependency-report
        path: |
          safety-report.json
          safety-output.txt

  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --only-verified
      continue-on-error: true

  docker-security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t securetask:${{ github.sha }} .
        docker tag securetask:${{ github.sha }} securetask:latest

    - name: Install Trivy
      run: |
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y

    - name: Run Trivy Vulnerability Scan
      run: |
        trivy image --format json --output trivy-report.json securetask:latest || true
        trivy image --severity ${{ env.TRIVY_SEVERITY }} --exit-code 1 securetask:latest
        trivy image securetask:latest
      continue-on-error: false

    - name: Upload Trivy Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-container-report
        path: trivy-report.json

  security-gate-check:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, secret-scan, docker-security]
    if: always()
    steps:
    - name: Check Security Gate Status
      run: |
        echo "=========================================="
        echo "Security Gate Status Summary"
        echo "=========================================="
        echo ""
        echo "SAST (Bandit):          ${{ needs.sast-scan.result }}"
        echo "SCA (Safety):           ${{ needs.dependency-scan.result }}"
        echo "Secrets (TruffleHog):   ${{ needs.secret-scan.result }}"
        echo "Container (Trivy):      ${{ needs.docker-security.result }}"
        echo ""

        if [[ "${{ needs.sast-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.dependency-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.docker-security.result }}" == "failure" ]]; then
          echo "DEPLOYMENT BLOCKED: Security gates failed!"
          exit 1
        else
          echo "All security gates passed!"
          echo "Deployment can proceed."
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: security-gate-check
    if: needs.security-gate-check.result == 'success'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Simulate Deployment
      run: |
        echo "=========================================="
        echo "DEPLOYING TO STAGING"
        echo "=========================================="
        echo "All security checks passed!"
        echo "Deploying version: ${{ github.sha }}"
        echo "Deployment successful!"

  generate-security-report:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, docker-security]
    if: always()
    steps:
    - name: Download all reports
      uses: actions/download-artifact@v4

    - name: Generate Security Summary
      run: |
        echo "# Security Scan Summary Report" > security-summary.md
        echo "" >> security-summary.md
        echo "**Scan Date:** $(date)" >> security-summary.md
        echo "**Commit:** ${{ github.sha }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        echo "| Tool | Status |" >> security-summary.md
        echo "|------|--------|" >> security-summary.md
        echo "| Bandit (SAST) | ${{ needs.sast-scan.result }} |" >> security-summary.md
        echo "| Safety (SCA) | ${{ needs.dependency-scan.result }} |" >> security-summary.md
        echo "| Trivy (Container) | ${{ needs.docker-security.result }} |" >> security-summary.md
        echo "" >> security-summary.md
        cat security-summary.md

    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary-report
        path: security-summary.md