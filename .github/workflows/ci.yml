name: CI/CD Pipeline with Security Scanning and Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Security gate thresholds
  BANDIT_SEVERITY_THRESHOLD: MEDIUM
  SAFETY_SEVERITY_THRESHOLD: MEDIUM
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django Tests
      env:
        USE_SQLITE: 'True'
      run: |
        python manage.py migrate
        python manage.py test
    
    - name: Check Django deployment readiness
      env:
        USE_SQLITE: 'True'
      run: |
        python manage.py check --deploy || true

  # Job 2: SAST - Static Application Security Testing (WITH GATE)
  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Bandit
      run: pip install bandit
    
    - name: Run Bandit Security Scan
      id: bandit_scan
      run: |
        echo "Running Bandit with severity threshold: ${{ env.BANDIT_SEVERITY_THRESHOLD }}"
        bandit -r tasks/ securetask/ -f json -o bandit-report.json -ll || true
        bandit -r tasks/ securetask/ -ll
      continue-on-error: false  # GATE: Fail if critical issues
    
    - name: Upload Bandit Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json

  # Job 3: SCA - Software Composition Analysis (WITH GATE)
  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies and Safety
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety
    
    - name: Run Safety Check
      id: safety_scan
      run: |
        echo "Running Safety dependency scan"
        
        # Run safety and redirect JSON output
        safety check --json > safety-report.json 2>&1 || true
        
        # Display the report
        cat safety-report.json
        
        # Check for critical vulnerabilities
        CRITICAL_COUNT=$(cat safety-report.json | jq '[.vulnerabilities[]? | select(.severity == "critical")] | length' 2>/dev/null || echo "0")
        echo "Critical vulnerabilities found: $CRITICAL_COUNT"
        
        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ SECURITY GATE FAILED: Critical vulnerabilities detected!"
          safety check
          exit 1
        else
          echo "✅ No critical vulnerabilities found"
          safety check || true
        fi
      continue-on-error: false
    
    - name: Upload Safety Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safety-dependency-report
        path: safety-report.json

  # Job 4: Secret Scanning (WITH GATE)
  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --only-verified
      # continue-on-error: true  # For demo, allow unverified secrets
      # In production: set to false to block on verified secrets

  # Job 5: Docker Build and Scan (WITH GATE)
  docker-security:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker Image
      run: |
        docker build -t securetask:${{ github.sha }} .
        docker tag securetask:${{ github.sha }} securetask:latest
    
    - name: Install Trivy
      run: |
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy
    
    - name: Run Trivy Vulnerability Scan with Gate
      id: trivy_scan
      run: |
        echo "Scanning with severity threshold: ${{ env.TRIVY_SEVERITY }}"
        
        # Generate full report
        trivy image --format json --output trivy-report.json securetask:latest || true
        
        # Check for HIGH/CRITICAL vulnerabilities (SECURITY GATE)
        trivy image --severity ${{ env.TRIVY_SEVERITY }} --exit-code 1 securetask:latest
        
        # If above passes, show full report
        trivy image securetask:latest
      continue-on-error: false  # GATE: Fail on HIGH/CRITICAL
    
    - name: Upload Trivy Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-container-report
        path: trivy-report.json
# Job 5.5: DAST Scan (runs separately due to needing running app)
  dast-trigger:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Trigger DAST Workflow
      run: |
        echo "DAST scanning is performed in separate workflow"
        echo "See: .github/workflows/dast-scan.yml"
        echo "DAST scans the RUNNING application for:"
        echo "  - XSS vulnerabilities"
        echo "  - CSRF issues"
        echo "  - Authentication problems"
        echo "  - Session management flaws"
  # Job 6: Security Gate Summary
  security-gate-check:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, secret-scan, docker-security]
    if: always()
    
    steps:
    - name: Check Security Gate Status
      run: |
        echo "=========================================="
        echo "Security Gate Status Summary"
        echo "=========================================="
        echo ""
        echo "SAST (Bandit): ${{ needs.sast-scan.result }}"
        echo "SCA (Safety): ${{ needs.dependency-scan.result }}"
        echo "Secrets (TruffleHog): ${{ needs.secret-scan.result }}"
        echo "Container (Trivy): ${{ needs.docker-security.result }}"
        echo ""
        
        if [[ "${{ needs.sast-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.dependency-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.docker-security.result }}" == "failure" ]]; then
          echo " DEPLOYMENT BLOCKED: Security gates failed!"
          echo "Fix the security issues before deployment."
          exit 1
        else
          echo " All security gates passed!"
          echo "Deployment can proceed."
        fi

  # Job 7: Deploy (Only if security gates pass)
  deploy:
    runs-on: ubuntu-latest
    needs: security-gate-check
    if: needs.security-gate-check.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Simulate Deployment
      run: |
        echo "=========================================="
        echo " DEPLOYING TO STAGING"
        echo "=========================================="
        echo ""
        echo "All security checks passed!"
        echo "Deploying version: ${{ github.sha }}"
        echo ""
        echo "Deployment steps would go here:"
        echo "  - Push Docker image to registry"
        echo "  - Update Kubernetes deployment"
        echo "  - Run smoke tests"
        echo ""
        echo "Deployment successful!"

  # Job 8: Security Report Generation
  generate-security-report:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, docker-security]
    if: always()
    
    steps:
    - name: Download all reports
      uses: actions/download-artifact@v4
    
    - name: Generate Security Summary
      run: |
        echo "# Security Scan Summary Report" > security-summary.md
        echo "" >> security-summary.md
        echo "**Scan Date:** $(date)" >> security-summary.md
        echo "**Commit:** ${{ github.sha }}" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        echo "| Tool | Status | Report |" >> security-summary.md
        echo "|------|--------|--------|" >> security-summary.md
        echo "| Bandit (SAST) | ${{ needs.sast-scan.result }} | bandit-security-report |" >> security-summary.md
        echo "| Safety (SCA) | ${{ needs.dependency-scan.result }} | safety-dependency-report |" >> security-summary.md
        echo "| Trivy (Container) | ${{ needs.docker-security.result }} | trivy-container-report |" >> security-summary.md
        echo "" >> security-summary.md
        
        cat security-summary.md
    
    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary-report
        path: security-summary.md