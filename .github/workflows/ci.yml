---
name: CI/CD Pipeline with Security Scanning and Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  BANDIT_SEVERITY_THRESHOLD: MEDIUM
  SAFETY_SEVERITY_THRESHOLD: MEDIUM
  TRIVY_SEVERITY: HIGH,CRITICAL
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django Tests
        env:
          USE_SQLITE: 'true'
        run: |
          python manage.py migrate
          python manage.py test
      - name: Check Django deployment readiness
        env:
          USE_SQLITE: 'true'
        run: python manage.py check --deploy || true
  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Security Scan
        run: |
          bandit -r tasks/ securetask/ -f json -o bandit-report.json -ll || true
          bandit -r tasks/ securetask/ -ll
        continue-on-error: false
      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies and Safety
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety
      - name: Run Safety Scan
        run: safety scan --output json > safety-report.json 2>&1 || true
        continue-on-error: true
      - name: Validate and Display Safety Report
        run: |
          if python3 -c "import json; json.load(open('safety-report.json'))" 2>/dev/null; then
            echo "Valid JSON report generated"
            cat safety-report.json
          else
            echo "Creating fallback report"
            safety scan > safety-output.txt 2>&1 || true
            python3 scripts/fix_safety_report.py
            cat safety-report.json
          fi
          safety scan || true
        continue-on-error: true
      - name: Upload Safety Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-dependency-report
          path: safety-report.json
  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
  docker-security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: |
          docker build -t securetask:${{ github.sha }} .
          docker tag securetask:${{ github.sha }} securetask:latest
      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
      - name: Run Trivy Scan
        run: |
          trivy image \
            --format json \
            --output trivy-report.json \
            securetask:latest || true
          trivy image \
            --severity ${{ env.TRIVY_SEVERITY }} \
            --exit-code 1 \
            securetask:latest
          trivy image securetask:latest
        continue-on-error: false
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-report.json
  security-gate-check:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, secret-scan, docker-security]
    if: always()
    steps:
      - name: Check Security Gate Status
        run: |
          echo "========================================="
          echo "Security Gate Status Summary"
          echo "========================================="
          echo "SAST (Bandit):        ${{ needs.sast-scan.result }}"
          echo "SCA (Safety):         ${{ needs.dependency-scan.result }}"
          echo "Secrets (TruffleHog): ${{ needs.secret-scan.result }}"
          echo "Container (Trivy):    ${{ needs.docker-security.result }}"
          echo "========================================="
          SAST="${{ needs.sast-scan.result }}"
          TRIVY="${{ needs.docker-security.result }}"
          if [[ "$SAST" == "failure" ]] || [[ "$TRIVY" == "failure" ]]; then
            echo "DEPLOYMENT BLOCKED: Security gates failed!"
            exit 1
          else
            echo "Security gates passed!"
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: security-gate-check
    if: needs.security-gate-check.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Simulate Deployment
        run: |
          echo "========================================="
          echo "DEPLOYING TO STAGING"
          echo "========================================="
          echo "All security checks passed!"
          echo "Deploying version: ${{ github.sha }}"
          echo "Deployment successful!"
  generate-security-report:
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, docker-security]
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "**Date:** $(date)" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "| Tool | Status |" >> security-summary.md
          echo "|------|--------|" >> security-summary.md
          echo "| Bandit (SAST) | ${{ needs.sast-scan.result }} |" >> security-summary.md
          echo "| Safety (SCA) | ${{ needs.dependency-scan.result }} |" >> security-summary.md
          echo "| Trivy | ${{ needs.docker-security.result }} |" >> security-summary.md
          cat security-summary.md
      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-report
          path: security-summary.md